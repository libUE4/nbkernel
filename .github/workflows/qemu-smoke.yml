name: QEMU smoke test

# 用构建用的同一个 DDK 内核启动一台 arm64 虚机，把刚编出的模块 insmod 进内核，
# 验证驱动真的能加载，而不是只看编译产物大小。
on:
  workflow_dispatch:
    inputs:
      kmi:
        description: '要启动的 KMI：all 或矩阵中的单个值'
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.kmi }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve smoke matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve matrix from inputs
        id: resolve
        run: |
          set -euo pipefail
          all='["android12-5.10","android13-5.10","android13-5.15","android14-5.15","android14-6.1","android15-6.6","android16-6.12","android17-6.18"]'
          kmi='${{ inputs.kmi }}'
          if [ -z "$kmi" ] || [ "$kmi" = "all" ]; then
            echo "matrix={\"kmi\":$all}" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$all" | grep -qx ".*\"$kmi\".*"; then
            echo "matrix={\"kmi\":[\"$kmi\"]}" >> "$GITHUB_OUTPUT"
          else
            echo "未知 KMI: $kmi" >&2
            exit 1
          fi
          cat "$GITHUB_OUTPUT"

  smoke:
    name: Boot ${{ matrix.kmi }} and load NBG.ko
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      KMI: ${{ matrix.kmi }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build kernel module
        run: |
          set -euo pipefail
          make -j"$(nproc)" KDIR="${KERNEL_SRC:?KERNEL_SRC is not set}"
          test -s NBG.ko
          echo "KO size=$(stat -c %s NBG.ko) bytes"

      - name: Dump kernel ABI
        run: |
          set -euo pipefail
          {
            echo "KMI=${KMI}"
            echo "KERNEL_SRC=${KERNEL_SRC}"
            echo '--- /opt/ddk ---'
            ls /opt/ddk 2>/dev/null || true
            ls /opt/ddk/src 2>/dev/null || true

            VMALLOC_H=$(find /opt/ddk -path '*include/linux/vmalloc.h' 2>/dev/null | head -n 1)
            MM_H=$(find /opt/ddk -path '*include/linux/mm.h' 2>/dev/null | head -n 1)
            VMALLOC_C=$(find /opt/ddk -path '*/mm/vmalloc.c' 2>/dev/null | head -n 1)
            MEMORY_C=$(find /opt/ddk -path '*/mm/memory.c' 2>/dev/null | head -n 1)
            CONFIG=$(find /opt/ddk -name '.config' 2>/dev/null | head -n 1)

            echo "VMALLOC_H=${VMALLOC_H:-none}"
            echo "MM_H=${MM_H:-none}"
            echo "VMALLOC_C=${VMALLOC_C:-none}"
            echo "MEMORY_C=${MEMORY_C:-none}"

            echo '--- CFI config ---'
            [ -n "${CONFIG:-}" ] && grep -E 'CONFIG_CFI_CLANG|CONFIG_LTO_CLANG' "$CONFIG" || echo '(no .config)'

            echo '--- vmalloc.h ---'
            [ -n "${VMALLOC_H:-}" ] && grep -n 'get_vm_area_caller\|free_vm_area' "$VMALLOC_H" || echo '(not found)'

            echo '--- mm.h apply_to_page_range ---'
            [ -n "${MM_H:-}" ] && grep -n 'apply_to_page_range' "$MM_H" || echo '(not found)'

            echo '--- mm/vmalloc.c ---'
            [ -n "${VMALLOC_C:-}" ] && grep -n -A5 'get_vm_area_caller(unsigned long' "$VMALLOC_C" || echo '(not found)'

            echo '--- mm/memory.c ---'
            [ -n "${MEMORY_C:-}" ] && grep -n -A5 'int apply_to_page_range(struct mm_struct' "$MEMORY_C" || echo '(not found)'
          } > kernel_api.txt 2>&1
          cat kernel_api.txt

      - name: Locate bootable kernel
        run: |
          set -euo pipefail
          echo "KERNEL_SRC=${KERNEL_SRC}"
          echo '--- candidate images ---'
          find "${KERNEL_SRC}" -maxdepth 3 \( -name 'Image*' -o -name 'vmlinux*' \) -printf '%s %p\n' 2>/dev/null | sort -rn | head -n 10 || true

      - name: Install qemu and busybox
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends qemu-system-arm busybox-static ipxe-qemu
          command -v qemu-system-aarch64
          command -v busybox

      - name: Prepare boot image
        run: |
          set -euo pipefail
          mkdir -p boot
          if [ -s "${KERNEL_SRC}/arch/arm64/boot/Image" ]; then
            cp "${KERNEL_SRC}/arch/arm64/boot/Image" boot/Image
          elif [ -s "${KERNEL_SRC}/arch/arm64/boot/Image.gz" ]; then
            cp "${KERNEL_SRC}/arch/arm64/boot/Image.gz" boot/Image.gz
            gunzip -f boot/Image.gz
          elif [ -s "${KERNEL_SRC}/vmlinux" ]; then
            # vmlinux 是 ELF，objcopy 出裸二进制即可由 qemu 直接装载
            objcopy -O binary -R .note -R .comment -S "${KERNEL_SRC}/vmlinux" boot/Image
          else
            echo '没有找到可启动的内核镜像' >&2
            exit 1
          fi
          ls -la boot/Image

      - name: Build initramfs
        run: |
          set -euo pipefail
          rm -rf initramfs
          mkdir -p initramfs
          cp NBG.ko initramfs/NBG.ko
          # DDK 镜像是 x86-64，装出来的 busybox 在 arm64 guest 里是 ENOEXEC，
          # 所以 init 用 freestanding 代码自己编，只依赖裸 syscall。
          clang --target=aarch64-linux-gnu -O2 -ffreestanding -nostdlib \
                -static -fno-pic -no-pie -fno-stack-protector -fno-builtin \
                -Wl,-e,_start -Wl,--build-id=none \
                -o initramfs/init test/qemu_init.c
          ( cd initramfs && find . -print | /bin/busybox cpio -o -H newc --quiet ) > initrd.cpio
          gzip -9 -f initrd.cpio
          ls -la initrd.cpio.gz initramfs/init

      - name: Boot and load module
        run: |
          set -euo pipefail
          set +e
          timeout 240 qemu-system-aarch64 \
            -M virt -cpu max -m 2048 -smp 2 \
            -kernel boot/Image -initrd initrd.cpio.gz \
            -append 'console=ttyAMA0 rdinit=/init panic=-1 loglevel=7' \
            -nic none -nographic -no-reboot > qemu.log 2>&1
          rc=$?
          set -e
          echo "qemu_exit=$rc"
          tail -n 40 qemu.log

          if grep -q 'INIT_MODULE_OK' qemu.log; then
            echo "SMOKE_RESULT=module_loaded kernel=$(grep -m1 'Linux version' qemu.log || true)"
          else
            echo 'SMOKE_RESULT=module_load_failed' >&2
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-smoke-${{ matrix.kmi }}
          path: |
            qemu.log
            kernel_api.txt
          if-no-files-found: warn
          retention-days: 14
