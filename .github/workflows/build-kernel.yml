name: Build NBG.ko

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NBG.ko for ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      KMI: ${{ matrix.kmi }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build kernel module
        run: |
          set -euo pipefail
          make -j"$(nproc)" KDIR="${KERNEL_SRC:?KERNEL_SRC is not set}"
          test -s NBG.ko

      - name: Verify module version section
        run: |
          set -euo pipefail
          readelf_bin="$(command -v readelf || command -v llvm-readelf)"
          size_hex="$("$readelf_bin" -SW NBG.ko | awk '$2 == "__versions" { print $6; exit }')"
          test -n "$size_hex"
          test "$((16#$size_hex))" -gt 0
          strings -a NBG.ko | grep -qx 'module_layout'
          echo "KO_CHECK __versions=0x${size_hex} module_layout=ok"

      - name: Prepare kernel artifact
        run: |
          set -euo pipefail
          mkdir -p out
          output="NBG-${KMI}.ko"
          cp NBG.ko "out/$output"
          cd out
          sha256sum "$output" > "$output.sha256"
          test -s "$output"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nbg-kernel-${{ matrix.kmi }}
          path: |
            out/NBG-${{ matrix.kmi }}.ko
            out/NBG-${{ matrix.kmi }}.ko.sha256
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package and publish release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download kernel modules
        uses: actions/download-artifact@v4
        with:
          pattern: nbg-kernel-*
          merge-multiple: true
          path: out

      - name: Verify modules and compress
        run: |
          set -euo pipefail
          for kmi in android12-5.10 android13-5.10 android13-5.15 \
                     android14-5.15 android14-6.1 android15-6.6 \
                     android16-6.12 android17-6.18; do
            (cd out && sha256sum --check "NBG-$kmi.ko.sha256")
          done
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          for module in sorted(Path("out").glob("*.ko")):
              archive = Path("out") / f"{module.name}.zip"
              with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as output:
                  output.write(module, arcname=module.name)
              print(f"{archive.name}: {module.stat().st_size} -> {archive.stat().st_size} bytes")
          PY
          cd out
          for archive in *.ko.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Upload pull request distribution
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nbg-kernel-all
          path: |-
            out/*.ko
            out/*.ko.sha256
            out/*.ko.zip
            out/*.ko.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        if: github.event_name != 'pull_request'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_name="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # Include the run and attempt so same-day builds and retries cannot collide.
          release_tag="$(date -u -d "$release_name" '+%Y-%m-%d-%H%M%S')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_id="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$release_tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$release_name" \
              -f body="Built from ${GITHUB_SHA}. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
              -F draft=true \
              --jq '.id'
          )"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload, verify and publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          files=(
            out/*.ko
            out/*.ko.sha256
            out/*.ko.zip
            out/*.ko.zip.sha256
          )
          gh release upload "$RELEASE_TAG" "${files[@]}"

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --paginate --jq '.[] | [.name, .size] | @tsv')"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            expected_size="$(stat -c %s "$file")"
            actual_size="$(printf '%s\n' "$assets" | awk -v name="$name" '$1 == name {print $2}')"
            if [ "$expected_size" -le 0 ] || [ "$actual_size" != "$expected_size" ]; then
              echo "Release asset missing or size mismatch: $name" >&2
              exit 1
            fi
          done

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true >/dev/null

      - name: Delete incomplete release
        if: ${{ (failure() || cancelled()) && steps.release.outputs.release_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          # A failed response after publishing must not delete a complete release.
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')"
          if [ "$draft" = true ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true
          fi
