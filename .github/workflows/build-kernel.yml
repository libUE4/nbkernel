name: Build NBG.ko

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kmi:
        description: '目标 KMI：all 或矩阵中的单个值'
        required: false
        default: all
        type: string
      debug:
        description: '带 NBG_DEBUG 日志构建'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      single: ${{ steps.resolve.outputs.single }}
    steps:
      - name: Resolve matrix from inputs
        id: resolve
        run: |
          set -euo pipefail
          all='["android12-5.10","android13-5.10","android13-5.15","android14-5.15","android14-6.1","android15-6.6","android16-6.12","android17-6.18"]'
          kmi='${{ inputs.kmi }}'
          if [ -z "$kmi" ] || [ "$kmi" = "all" ]; then
            echo "matrix={\"kmi\":$all}" >> "$GITHUB_OUTPUT"
            echo "single=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$all" | grep -qx ".*\"$kmi\".*"; then
            echo "matrix={\"kmi\":[\"$kmi\"]}" >> "$GITHUB_OUTPUT"
            echo "single=true" >> "$GITHUB_OUTPUT"
          else
            echo "未知 KMI: $kmi" >&2
            exit 1
          fi
          cat "$GITHUB_OUTPUT"

  build:
    name: Build NBG.ko for ${{ matrix.kmi }}
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      KMI: ${{ matrix.kmi }}
      NBG_DEBUG: ${{ inputs.debug && '1' || '0' }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build kernel module
        run: |
          set -uo pipefail
          make -j"$(nproc)" KDIR="${KERNEL_SRC:?KERNEL_SRC is not set}" NBG_DEBUG="${NBG_DEBUG}" 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            cp /tmp/build.log build-errors.txt
            exit "$rc"
          fi
          test -s NBG.ko

      - name: Upload build errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors-android15-6.6
          path: build-errors.txt
          if-no-files-found: ignore

      - name: Verify kernel module
        run: |
          set -euo pipefail
          test -s NBG.ko
          echo "KO_CHECK size=$(stat -c %s NBG.ko) bytes"
          # 缺 module_layout 的版本记录只让内核打一条 no symbol version 警告，
          # 不是加载条件，所以这里只报告不断言。
          if grep -aq 'module_layout' NBG.ko; then
            echo "KO_CHECK module_layout=present"
          else
            echo "KO_CHECK module_layout=absent (kernel will warn, load unaffected)"
          fi
          if command -v llvm-readelf >/dev/null 2>&1; then
            llvm-readelf -SW NBG.ko | awk '$2 == "__versions" { print "KO_CHECK __versions size=0x" $6 }'
          elif command -v readelf >/dev/null 2>&1; then
            readelf -SW NBG.ko | awk '$2 == "__versions" { print "KO_CHECK __versions size=0x" $6 }'
          else
            echo "KO_CHECK __versions 跳过：镜像内无 readelf"
          fi

      - name: Prepare kernel artifact
        run: |
          set -euo pipefail
          mkdir -p out
          output="NBG-${KMI}.ko"
          cp NBG.ko "out/$output"
          cd out
          sha256sum "$output" > "$output.sha256"
          test -s "$output"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nbg-kernel-${{ matrix.kmi }}
          path: |
            out/NBG-${{ matrix.kmi }}.ko
            out/NBG-${{ matrix.kmi }}.ko.sha256
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package and publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.single == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download kernel modules
        uses: actions/download-artifact@v4
        with:
          pattern: nbg-kernel-*
          merge-multiple: true
          path: out

      - name: Verify modules and compress
        run: |
          set -euo pipefail
          for file in out/*.ko.sha256; do
            (cd out && sha256sum --check "$(basename "$file")")
          done
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          for module in sorted(Path("out").glob("*.ko")):
              archive = Path("out") / f"{module.name}.zip"
              with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as output:
                  output.write(module, arcname=module.name)
              print(f"{archive.name}: {module.stat().st_size} -> {archive.stat().st_size} bytes")
          PY
          cd out
          for archive in *.ko.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Upload pull request distribution
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nbg-kernel-all
          path: |-
            out/*.ko
            out/*.ko.sha256
            out/*.ko.zip
            out/*.ko.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        if: github.event_name != 'pull_request'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_name="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # Include the run and attempt so same-day builds and retries cannot collide.
          release_tag="$(date -u -d "$release_name" '+%Y-%m-%d-%H%M%S')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_id="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$release_tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$release_name" \
              -f body="Built from ${GITHUB_SHA}. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
              -F draft=true \
              --jq '.id'
          )"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload, verify and publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          files=(
            out/*.ko
            out/*.ko.sha256
            out/*.ko.zip
            out/*.ko.zip.sha256
          )
          gh release upload "$RELEASE_TAG" "${files[@]}"

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --paginate --jq '.[] | [.name, .size] | @tsv')"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            expected_size="$(stat -c %s "$file")"
            actual_size="$(printf '%s\n' "$assets" | awk -v name="$name" '$1 == name {print $2}')"
            if [ "$expected_size" -le 0 ] || [ "$actual_size" != "$expected_size" ]; then
              echo "Release asset missing or size mismatch: $name" >&2
              exit 1
            fi
          done

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true >/dev/null

      - name: Delete incomplete release
        if: ${{ (failure() || cancelled()) && steps.release.outputs.release_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          # A failed response after publishing must not delete a complete release.
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')"
          if [ "$draft" = true ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true
          fi
